    :root {
      --bg-color: #FFF7EB; /* Warm cream matching theme */
      --text-color: #000000;
      --accent-color: #6C0D2C; /* Deep Wine Red matching theme */
      --font-sans: 'Outfit', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-sans);
      overflow-y: auto !important;
      overflow-x: hidden !important;
      width: 100% !important;
      height: auto !important;
      overscroll-behavior: auto !important;
      -webkit-tap-highlight-color: transparent;
    }

    /* Outer scrollable canvas mimicking mt-42 equivalent */
    .scroll-container {
      position: relative;
      width: 100%;
      height: 350vh;
      height: 350svh;
      height: 350dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px;
      box-sizing: border-box;
    }

    /* Header Container matching original styling */
    .header-container {
      height: 100svh;
      height: 100dvh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      padding: 0 40px 120px 40px;
      transform: translateX(-40px);
    }

    .title {
      position: relative;
      z-index: 10;
      font-family: var(--font-sans);
      font-size: clamp(3.2rem, 8.5vw, 6.8rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.05em;
      margin: 0;
      color: #000000;
    }

    .subtitle {
      position: relative;
      z-index: 10;
      font-size: 1.05rem;
      font-weight: 500;
      margin-top: 12px;
      color: rgba(26, 46, 59, 0.6);
      letter-spacing: -0.01em;
    }

    /* Absolute positioned SVG follow path */
    .scroll-svg {
      position: absolute;
      top: 120px;
      right: 4%;
      width: 1200px;
      height: 2319px;
      z-index: 0;
      overflow: visible;
      pointer-events: none;
    }

    /* Responsive adjustments for the giant SVG layout */
    @media (max-width: 1024px) {
      .scroll-svg {
        top: 100px;
        right: -15%;
        width: 1000px;
      }
    }
    @media (max-width: 768px) {
      .scroll-container {
        height: 250vh; /* Scaled down layout height for smaller screens */
        height: 250svh;
        height: 250dvh;
      }
      .scroll-svg {
        right: -25%;
        width: 800px;
        top: 120px;
      }
      .title {
        font-size: clamp(2.2rem, 8.5vw, 4.5rem);
      }
    }

    /* Footer Card sliding container matching moosa pind style */
    .footer-card {
      position: absolute;
      top: 220vh;
      top: 220svh;
      top: 220dvh;
      width: calc(100% - 48px);
      max-width: 1400px;
      border-radius: 32px;
      background-color: #000000; /* Contrast black neobrutalist backplane */
      color: var(--bg-color);
      padding: 80px 40px 40px 40px;
      box-sizing: border-box;
      border: 2px solid #000000;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .footer-card {
        top: 155vh;
        top: 155svh;
        top: 155dvh;
        padding: 40px 24px 24px 24px;
        border-radius: 24px;
      }
    }

    .footer-title {

      line-height: 0.85;
      letter-spacing: -0.04em;
      text-align: center;

  <script>
    (function() {

      // 2. Exact Scroll progress calculation from reference page
      const path = document.getElementById('scroll-path');
      const svg = document.querySelector('.scroll-svg');

      if (window.innerWidth <= 480) {
        // Crop SVG viewBox horizontal margins to scale up the curves, keeping them fully inside the viewport
        svg.setAttribute('viewBox', '360 0 900 2319');
        // Increase stroke weight to make the curves look bold and thick on mobile
        path.setAttribute('stroke-width', '28');
      }

      let scrollTickerActive = false;
      function updatePathProgress() {
        const scrollY = window.scrollY;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        
        // Calculate fraction scrolled from 0 to 1
        const fraction = maxScroll > 0 ? Math.min(Math.max(scrollY / maxScroll, 0), 1) : 0;
        
        // Map progress to go from 0.5 to 1.0 (starting half drawn on page load to display behind title)
        const pathLength = 0.5 + fraction * 0.5;
        
        // Update SVG path length attribute
        path.setAttribute('stroke-dasharray', `${pathLength} 1`);
      }

      function onScrollOrResize() {
        if (!scrollTickerActive) {
          scrollTickerActive = true;
          requestAnimationFrame(() => {
            updatePathProgress();
            scrollTickerActive = false;
          });
        }
      }

      // Bind scroll and resize events
      window.addEventListener('scroll', onScrollOrResize);
      window.addEventListener('resize', onScrollOrResize);
      
      // Initial snap execution
      updatePathProgress();
      setTimeout(updatePathProgress, 200);
    })();
  </script>
