  <style>
    :root {
      --bg-color: #FFF7EB; /* Warm cream matching theme */
      --text-color: #000000;
      --accent-color: #6C0D2C; /* Deep Wine Red matching theme */
      --font-sans: 'Outfit', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-sans);
      overflow-y: auto !important;
      overflow-x: hidden !important;
      width: 100% !important;
      height: auto !important;
      overscroll-behavior: auto !important;
      -webkit-tap-highlight-color: transparent;
    }

    /* Outer scrollable canvas mimicking mt-42 equivalent */
    .scroll-container {
      position: relative;
      width: 100%;
      height: 350vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px;
      box-sizing: border-box;
    }

    /* Header Container */
    .header-container {
      min-height: 85vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      padding: clamp(100px, 14vh, 140px) 24px 60px 24px;
      transform: none;
    }

    .title {
      position: relative;
      z-index: 10;
      font-family: var(--font-sans);
      font-size: clamp(2.8rem, 6.5vw, 5.8rem);
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -0.04em;
      margin: 0;
      color: #000000;
      text-align: center;
    }

    .subtitle {
      position: relative;
      z-index: 10;
      font-size: 1.05rem;
      font-weight: 500;
      margin-top: 12px;
      color: rgba(26, 46, 59, 0.6);
      letter-spacing: -0.01em;
    }

    /* Centered SVG follow path */
    .scroll-svg {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1200px, 95vw);
      height: auto;
      max-height: 2400px;
      z-index: 0;
      overflow: visible;
      pointer-events: none;
    }

    /* Responsive adjustments for SVG layout */
    @media (max-width: 1024px) {
      .scroll-svg {
        top: 80px;
        width: min(900px, 95vw);
      }
    }
    @media (max-width: 768px) {
      .scroll-container {
        height: 250vh;
      }
      .scroll-svg {
        width: 750px;
        top: 90px;
      }
      .title {
        font-size: clamp(2.2rem, 8vw, 4.2rem);
      }
    }

    /* Footer Card sliding container matching moosa pind style */
    .footer-card {
      position: absolute;
      top: 220vh;
      width: calc(100% - 48px);
      max-width: 1400px;
      border-radius: 32px;
      background-color: #000000; /* Contrast black neobrutalist backplane */
      color: var(--bg-color);
      padding: 80px 40px 40px 40px;
      box-sizing: border-box;
      border: 2px solid #000000;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .footer-card {
        top: 155vh;
        padding: 40px 24px 24px 24px;
        border-radius: 24px;
      }
    }

    .footer-title {
      font-size: clamp(3rem, 11vw, 9.5rem);
      font-weight: 800;
      line-height: 0.85;
      letter-spacing: -0.04em;
      text-align: center;
      text-transform: uppercase;
      margin: 0 0 80px 0;
      color: var(--bg-color);
    }

    @media (max-width: 768px) {
      .footer-title {
        margin-bottom: 40px;
      }
    }

    .footer-grid {
      display: flex;
      justify-content: space-between;
      width: 100%;
      flex-wrap: wrap;
      gap: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 40px;
    }

    .grid-col {
      display: flex;
      gap: 60px;
    }

    @media (max-width: 600px) {
      .grid-col {
        flex-direction: column;
        gap: 20px;
      }
      .footer-grid {
        flex-direction: column;
        gap: 20px;
      }
    }

    .info-text {
      text-transform: uppercase;
      font-size: 0.875rem;
      line-height: 1.5;
      margin: 0;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.7);
    }

    .info-text strong {
      color: #ffffff;
    }

    /* Mobile Phone Sizing and Centering Tweaks */
    @media (max-width: 480px) {
      .scroll-container {
        height: 200vh !important;
        padding: 0 16px !important;
        overflow-x: hidden !important;
      }
      .scroll-svg {
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%) !important;
        width: 100vw !important;
        height: auto !important;
        top: 240px !important;
      }
      .header-container {
        justify-content: flex-start !important;
        padding: 130px 16px 0 16px !important;
        transform: none !important;
      }
      .title {
        font-size: clamp(2.4rem, 10.5vw, 3.6rem) !important;
        line-height: 1.05 !important;
      }
      .footer-card {
        top: 100vh !important;
        width: calc(100% - 32px) !important;
        padding: 30px 16px 16px 16px !important;
        border-radius: 20px !important;
      }
    }
  </style>
</head>

  <script>
    (function() {
      // 1. Navigation Pill Prefetch Logic
      const nav = document.querySelector('.nav-pill');
      const items = nav.querySelectorAll('.nav-item');
      items.forEach(item => {
        item.addEventListener('mouseenter', () => {
          const href = item.getAttribute('href');
          if (href && href !== window.location.pathname) {
            const linkId = `prefetch-${href.replace(/\//g, '')}`;
            if (!document.getElementById(linkId)) {
              const link = document.createElement('link');
              link.id = linkId;
              link.rel = 'prefetch';
              link.href = href;
              document.head.appendChild(link);
            }
          }
        });
      });

      // 2. Exact Scroll progress calculation
      const path = document.getElementById('scroll-path');
      const svg = document.querySelector('.scroll-svg');

      function adjustViewBox() {
        if (window.innerWidth <= 480) {
          svg.setAttribute('viewBox', '360 0 900 2319');
          path.setAttribute('stroke-width', '28');
        } else {
          svg.setAttribute('viewBox', '0 0 1278 2319');
          path.setAttribute('stroke-width', '24');
        }
      }
      adjustViewBox();

      let scrollTickerActive = false;
      function updatePathProgress() {
        const scrollY = window.scrollY;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        
        // Calculate fraction scrolled from 0 to 1
        const fraction = maxScroll > 0 ? Math.min(Math.max(scrollY / maxScroll, 0), 1) : 0;
        
        // Map progress from 0.35 to 1.0 so scrolling immediately animates and draws the stroke down the canvas
        const pathLength = 0.35 + fraction * 0.65;
        
        // Update SVG path length attribute
        path.setAttribute('stroke-dasharray', `${pathLength} 1`);
      }

      function onScrollOrResize() {
        if (!scrollTickerActive) {
          scrollTickerActive = true;
          requestAnimationFrame(() => {
            adjustViewBox();
            updatePathProgress();
            scrollTickerActive = false;
          });
        }
      }

      // Bind scroll and resize events
      window.addEventListener('scroll', onScrollOrResize, { passive: true });
      window.addEventListener('resize', onScrollOrResize);
      
      // Initial executions to ensure instant correct draw on load
      updatePathProgress();
      setTimeout(updatePathProgress, 100);
      setTimeout(updatePathProgress, 400);
    })();
  </script>
