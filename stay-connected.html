  <style>
    /* Specific styles for the Stay Connected page */
    html, body {
      overflow-x: hidden;
      width: 100%;
      min-height: 100svh;
      min-height: 100dvh;
    }

    .connected-viewport {
      position: relative;
      width: 100%;
      height: 100svh;
      height: 100dvh;
      background-color: transparent;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    
    .connected-header {
      position: relative;
      margin-top: clamp(85px, 16vh, 150px);
      width: 100%;
      max-width: 600px;
      padding: 0 20px;
      box-sizing: border-box;
      text-align: center;
      z-index: 50;
      font-family: 'Outfit', sans-serif;
    }
    
    .connected-title {
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      line-height: 1.1;
    }
    
    /* Contact Card and Header Styling */
    .contact-header-wrap {
      position: relative;
      margin-top: clamp(105px, 14vh, 135px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      z-index: 50;
      padding: 0 20px;
      width: 100%;
      max-width: 900px;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    .contact-meta-tag {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6C0D2C;
      background: rgba(108, 13, 44, 0.08);
      border: 1.5px solid #6C0D2C;
      border-radius: 999px;
      padding: 3px 12px;
    }

    .contact-title {
      font-size: clamp(2.4rem, 4.4vw, 3.6rem);
      font-weight: 900;
      color: #000;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      margin: 0;
      line-height: 1;
    }

    .contact-desc {
      font-size: clamp(0.92rem, 1.2vw, 1.05rem);
      color: rgba(0, 0, 0, 0.68);
      max-width: 540px;
      margin: 0;
      line-height: 1.45;
    }

    /* Neo-brutalist Contact Card (Email) */
    .contact-card {
      margin-top: 2px;
      width: 100%;
      max-width: 480px;
      background: #FFF7EB;
      border: 2.5px solid #000;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #000;
      padding: 10px 16px;
      box-sizing: border-box;
      text-decoration: none;
      color: #000;
      display: block;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (hover: hover) and (pointer: fine) {
      .contact-card:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 #000;
      }
    }

    .contact-card:active {
      transform: translate(1px, 1px);
      box-shadow: 2.5px 2.5px 0 #000;
    }

    .contact-card-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .contact-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: #6C0D2C;
      color: #FFF7EB;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 2px solid #000;
      box-shadow: 2px 2px 0 #000;
    }

    .contact-icon-wrap svg {
      width: 18px;
      height: 18px;
    }

    .contact-email-link {
      font-size: clamp(1.05rem, 1.5vw, 1.25rem);
      font-weight: 800;
      color: #000;
      text-decoration: none;
      letter-spacing: -0.01em;
      transition: color 0.18s ease;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      text-align: left;
    }

    @media (hover: hover) and (pointer: fine) {
      .contact-email-link:hover {
        color: #6C0D2C;
      }
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #E5A93C;
      color: #000;
      border: 2px solid #000;
      border-radius: 8px;
      padding: 7px 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 2.5px 2.5px 0 #000;
      transition: background-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
      flex-shrink: 0;
    }

    @media (hover: hover) and (pointer: fine) {
      .copy-btn:hover {
        background: #F5B94C;
        transform: translateY(-2px);
        box-shadow: 4px 4px 0 #000;
      }
    }

    .copy-btn:active {
      transform: translateY(1px);
      box-shadow: 1px 1px 0 #000;
    }

    .copy-btn.copied {
      background: #22c55e;
      color: #FFF7EB;
    }

    /* 3 Side-by-side Contact Cards Grid */
    .contact-people-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 900px;
      margin-top: 6px;
      box-sizing: border-box;
    }

    .person-contact-card {
      background: #FFFDF9;
      border: 2.5px solid #000;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #000;
      padding: 16px 16px 14px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      min-height: 140px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (hover: hover) and (pointer: fine) {
      .person-contact-card:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 #000;
      }
    }

    .person-contact-card:active {
      transform: translate(1px, 1px);
      box-shadow: 2.5px 2.5px 0 #000;
    }

    .person-role-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #FFF7EB;
      background: #6C0D2C;
      border: 1.5px solid #000;
      border-radius: 5px;
      padding: 3px 8px;
      margin-bottom: 6px;
      white-space: nowrap;
    }

    .person-name {
      font-size: 1.25rem;
      font-weight: 900;
      color: #000;
      margin: 0 0 10px 0;
      letter-spacing: -0.02em;
      font-family: 'Outfit', sans-serif;
      line-height: 1.15;
    }

    .person-phone-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 6px;
      margin-top: auto;
      background: #FFF7EB;
      border: 1.5px solid #000;
      border-radius: 8px;
      padding: 6px 10px;
      box-sizing: border-box;
    }

    .person-phone-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.86rem;
      font-weight: 800;
      color: #000;
      text-decoration: none;
      font-family: monospace;
      transition: color 0.15s ease;
      white-space: nowrap;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (hover: hover) and (pointer: fine) {
      .person-phone-link:hover {
        color: #6C0D2C;
      }
    }

    .person-phone-link svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .person-copy-btn {
      display: inline-flex;
      align-items: center;
      background: #E5A93C;
      color: #000;
      border: 1.5px solid #000;
      border-radius: 6px;
      padding: 4px 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 1.5px 1.5px 0 #000;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    @media (hover: hover) and (pointer: fine) {
      .person-copy-btn:hover {
        background: #F5B94C;
        transform: translateY(-1px);
        box-shadow: 2.5px 2.5px 0 #000;
      }
    }

    .person-copy-btn:active {
      transform: translateY(1px);
      box-shadow: 1px 1px 0 #000;
    }

    .person-copy-btn.copied {
      background: #22c55e;
      color: #FFF7EB;
    }

    /* Clean canvas walking area anchored at bottom of viewport */
    #crowd-canvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: clamp(190px, 36vh, 320px);
      z-index: 5;
      pointer-events: none;
      filter: none;
    }

    /* =========================================================
       RESPONSIVE DESIGN (Single-screen on Mobile Portrait)
       ========================================================= */

    /* Tablet (769px to 860px) */

        height: 100svh;

        overflow: hidden;

      .contact-header-wrap {

      }

      .contact-title {
        font-size: clamp(1.85rem, 5.5vw, 2.15rem);

        margin: 0;
      }

      .contact-desc {
        font-size: clamp(0.78rem, 2.2vw, 0.86rem);
        line-height: 1.35;
        max-width: 360px;
        margin: 0;
      }

      .contact-card {
        position: relative;
        z-index: 12;
        max-width: 380px;
        padding: clamp(6px, 1vh, 9px) 12px;
        margin: 0;
        border: 2px solid #000;
        border-radius: 12px;
        box-shadow: 3px 3px 0 #000;
      }

      .contact-icon-wrap {
        width: 32px;
        height: 32px;
        border-radius: 7px;
      }

      .contact-icon-wrap svg {
        width: 16px;
        height: 16px;
      }

      .contact-email-link {
        font-size: clamp(0.92rem, 2.8vw, 1.05rem);
      }

      .copy-btn {

        font-size: 0.72rem;
        border-radius: 7px;
      }

      .contact-people-grid {
        position: relative;
        z-index: 12;
        grid-template-columns: 1fr;
        max-width: 380px;
        gap: clamp(6px, 1vh, 8px);

      }

      .person-contact-card {
        position: relative;
        z-index: 12;
        padding: clamp(7px, 1vh, 10px) 12px;
        border: 2px solid #000;
        border-radius: 12px;

        min-height: unset;
      }

      .person-role-badge {
        font-size: 0.6rem;
        padding: 2px 6px;
        border-radius: 4px;
        margin-bottom: 2px;
      }

      .person-name {

        margin: 0 0 4px 0;
        line-height: 1;
      }

      .person-phone-row {
        padding: 4px 8px;
        border: 1.5px solid #000;
        border-radius: 7px;
      }

      .person-phone-link {
        font-size: 0.78rem;
      }

      .person-phone-link svg {
        width: 12px;
        height: 12px;
      }

      .person-copy-btn {
        padding: 3px 8px;
        font-size: 0.68rem;
        border-radius: 5px;
      }

      #crowd-canvas {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: clamp(190px, 30vh, 260px);
        z-index: 1;
        pointer-events: none;
      }
    }

    /* Extra Small Width Devices (≤ 360px) */
    @media (max-width: 360px) {
      .contact-header-wrap {
        margin-top: 42px;
        gap: 5px;
        padding: 0 10px;
      }

      .contact-title {
        font-size: 1.7rem;
      }

      .contact-card {
        padding: 6px 10px;
      }

      .contact-email-link {
        font-size: 0.88rem;
      }

      .copy-btn span {
        display: none;
      }

      .copy-btn {
        padding: 4px 8px;
      }

      .person-contact-card {
        padding: 6px 10px;
      }

      .person-name {
        font-size: 0.96rem;
        margin-bottom: 2px;
      }
    }

    /* Landscape Mode on Phones (height ≤ 540px) */
    @media (max-height: 540px) and (orientation: landscape) {
      .connected-viewport {
        min-height: 100dvh;
        height: auto;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .contact-header-wrap {
        margin-top: 42px;
        padding-bottom: max(60px, calc(30px + env(safe-area-inset-bottom, 0px)));
        gap: 6px;
        max-width: 96%;
      }

      .contact-title {
        font-size: 1.6rem;
      }

      .contact-desc {
        font-size: 0.78rem;
      }

      .contact-people-grid {
        grid-template-columns: repeat(3, 1fr) !important;
        max-width: 100% !important;
        gap: 8px !important;
      }

      .person-contact-card {
        padding: 8px;
      }

      .person-name {
        font-size: 0.92rem;
        margin-bottom: 2px;
      }

      .person-phone-row {
        padding: 3px 6px;
      }

      .person-phone-link {
        font-size: 0.7rem;
      }

      #crowd-canvas {
        height: clamp(110px, 26vh, 150px);
      }
    }
  </style>

  <script>
    (function() {
      const nav = document.querySelector('.nav-pill');
      const items = nav.querySelectorAll('.nav-item');
      
      // Prefetch page on hover to ensure instant load
      items.forEach(item => {
        item.addEventListener('mouseenter', () => {
          const href = item.getAttribute('href');
          if (href && href !== window.location.pathname) {
            const linkId = `prefetch-${href.replace(/\//g, '')}`;
            if (!document.getElementById(linkId)) {
              const link = document.createElement('link');
              link.id = linkId;
              link.rel = 'prefetch';
              link.href = href;
              document.head.appendChild(link);
            }
          }
        });
      });
    })();
  </script>

  <script>
    (function() {
      const emailCard = document.getElementById('email-card');
      const copyBtn = document.getElementById('copy-email-btn');
      const email = 'mun@rnsit.ac.in';
      const subject = encodeURIComponent("Inquiry - RNSMUN 2026");

      // Smart Cross-Device Email Dispatch
      if (emailCard) {
        emailCard.addEventListener('click', (e) => {
          e.preventDefault();
          const isMobile = /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent) || 
                           (window.innerWidth <= 768 && window.matchMedia('(pointer: coarse)').matches);

          if (isMobile) {
            // Mobile: Launch native mail app with To and Subject filled
            window.location.href = `mailto:${email}?subject=${subject}`;
          } else {
            // Desktop: Open Gmail compose tab with To and Subject pre-filled
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${email}&su=${subject}`;
            window.open(gmailUrl, '_blank', 'noopener,noreferrer');

            // Also trigger mailto in background for desktop client users (Outlook, Apple Mail)
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = `mailto:${email}?subject=${subject}`;
            document.body.appendChild(iframe);
            setTimeout(() => {
              if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
            }, 1500);
          }
        });
      }

      // Clipboard Copy Action
      if (copyBtn) {
        copyBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          try {
            await navigator.clipboard.writeText(email);
            const textSpan = copyBtn.querySelector('span');
            const originalText = textSpan ? textSpan.textContent : 'Copy';
            copyBtn.classList.add('copied');
            if (textSpan) textSpan.textContent = 'Copied!';
            
            setTimeout(() => {
              copyBtn.classList.remove('copied');
              if (textSpan) textSpan.textContent = originalText;
            }, 2000);
          } catch (err) {
            // Fallback copy using execCommand
            const temp = document.createElement('input');
            temp.value = email;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
          }
        });
      }

      // Phone Number Copy Handler
      window.copyPhone = function(btn, phoneNum) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(phoneNum).then(() => {
            const originalText = btn.textContent;
            btn.textContent = '✓ Copied';
            btn.classList.add('copied');
            setTimeout(() => {
              btn.textContent = originalText;
              btn.classList.remove('copied');
            }, 2000);
          }).catch(() => {
            fallbackCopy(btn, phoneNum);
          });
        } else {
          fallbackCopy(btn, phoneNum);
        }
      };

      function fallbackCopy(btn, text) {
        const temp = document.createElement('input');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        const originalText = btn.textContent;
        btn.textContent = '✓ Copied';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('copied');
        }, 2000);
      }
    })();
  </script>
