<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Connected | MUNSoc RNSIT</title>
  <meta name="description" content="Get in touch with MUNSoc RNSIT. Connect with our delegation and stay updated with assemblies.">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mun-rnsit.vercel.app/stay-connected">
  <meta property="og:title" content="Stay Connected | MUNSoc RNSIT">
  <meta property="og:description" content="Get in touch with MUNSoc RNSIT. Connect with our delegation and stay updated with assemblies.">
  <meta property="og:image" content="https://raw.githubusercontent.com/Karthikprasadm/MUN/main/assets/Logos/MUN_logo.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://mun-rnsit.vercel.app/stay-connected">
  <meta property="twitter:title" content="Stay Connected | MUNSoc RNSIT">
  <meta property="twitter:description" content="Get in touch with MUNSoc RNSIT. Connect with our delegation and stay updated with assemblies.">
  <meta property="twitter:image" content="https://raw.githubusercontent.com/Karthikprasadm/MUN/main/assets/Logos/MUN_logo.png">
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" href="./assets/Logos/MUN_logo.png">
  <link rel="apple-touch-icon" href="/assets/Logos/MUN_logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6C0D2C">
  <style>
    /* Specific styles for the Stay Connected page matching skiper39 exactly */
    .connected-viewport {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      background-color: transparent;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .connected-header {
      position: absolute;
      top: clamp(65px, 14vh, 140px);
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      z-index: 50;
      pointer-events: none;
      font-family: 'Outfit', sans-serif;
    }
    
    .connected-title {
      font-size: clamp(2rem, 4.2vw, 3.2rem);
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    
    /* Minimalist Single-Line Subscription Form */
    .subscribe-form {
      display: flex;
      align-items: center;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      width: 440px;
      max-width: 88%;
      margin: clamp(10px, 2.5vh, 26px) auto 0 auto;
      border-bottom: 2px solid rgba(0, 0, 0, 0.15);
      transition: border-color 0.3s ease;
      pointer-events: auto; /* Enable input interactions */
      z-index: 60;
    }

    .subscribe-form:focus-within {
      border-color: #000000;
    }

    .subscribe-input {
      width: 0;
      flex-grow: 1;
      min-width: 0;
      border: none;
      background: transparent;
      padding: 8px 16px 8px 0;
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      font-weight: 400;
      color: var(--text-primary);
      outline: none;
      letter-spacing: -0.02em;
    }

    .subscribe-input::placeholder {
      color: rgba(0, 0, 0, 0.2); /* Subtle light placeholder */
    }

    .subscribe-btn {
      border: none;
      background: transparent;
      color: var(--text-primary);
      padding: 0;
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem; /* Large arrow matching input scale */
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .subscribe-btn:hover {
      transform: translateX(6px);
      opacity: 0.7;
    }

    .subscribe-btn:active {
      transform: translateX(3px);
    }
    
    /* Clean canvas walking area anchored at bottom of viewport */
    #crowd-canvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48vh; /* Lower crowd zone on desktop */
      z-index: 5;
      pointer-events: none;
      filter: none;
    }

    .subscribe-form.has-error {
      border-color: #6C0D2C !important; /* Deep wine red border matching active names theme */
    }

    .error-msg-container {
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      color: #6C0D2C; /* Deep Wine Red color */
      margin-top: 10px;
      height: 20px; /* Layout stability */
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.3s cubic-bezier(0.25, 1, 0.3, 1),
                  transform 0.3s cubic-bezier(0.25, 1, 0.3, 1);
      pointer-events: none;
      text-align: center;
      width: 100%;
      letter-spacing: -0.01em;
    }

    .error-msg-container.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Mobile Responsive Optimizations (< 768px) */
    @media (max-width: 768px) {
      .connected-header {
        top: clamp(90px, 24vh, 180px);
        left: 50%;
        transform: translateX(-50%);
      }
      .connected-title {
        font-size: 2.2rem; /* Scaled down to prevent text clipping */
        letter-spacing: -0.02em;
      }
      .subscribe-form {
        width: 290px; /* Compact width fitting mobile margins */
        margin-top: 20px;
        background: transparent;
        border: none;
        border-bottom: 2px solid rgba(0, 0, 0, 0.1);
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }
      .subscribe-input {
        font-size: 1.15rem; /* Proportionate input text size */
        padding: 8px 0;
      }
      .subscribe-btn {
        font-size: 1.4rem; /* Clean scaled arrow symbol */
      }
      #crowd-canvas {
        height: 38vh; /* Lower crowd zone on mobile */
      }
    }

  </style>
</head>
<body>


  <!-- Navigation Pill -->
  <nav class="nav-pill">
    <a href="/" class="nav-item" id="nav-gallery">Home</a>
    <a href="/past-events" class="nav-item" id="nav-past">Past Events</a>
    <a href="/registration" class="nav-item" id="nav-registration">Registration</a>
    <a href="/stay-connected" class="nav-item active" id="nav-connected">Stay Connected</a>
    <a href="/team" class="nav-item" id="nav-team">Team</a>
  </nav>

  <script>
    (function() {
      const nav = document.querySelector('.nav-pill');
      const items = nav.querySelectorAll('.nav-item');
      
      // Prefetch page on hover to ensure instant load
      items.forEach(item => {
        item.addEventListener('mouseenter', () => {
          const href = item.getAttribute('href');
          if (href && href !== window.location.pathname) {
            const linkId = `prefetch-${href.replace(/\//g, '')}`;
            if (!document.getElementById(linkId)) {
              const link = document.createElement('link');
              link.id = linkId;
              link.rel = 'prefetch';
              link.href = href;
              document.head.appendChild(link);
            }
          }
        });
      });
    })();
  </script>

  <!-- Top Left Logo -->
  <div class="top-left-logo-container">
    <img src="./assets/Logos/25_logo.png" alt="25 Logo" class="top-left-logo">
  </div>

  <!-- Top Right Logo -->
  <div class="top-right-logo-container">
    <img src="./assets/Logos/MUN_logo.png" alt="MUN Logo" class="top-right-logo">
  </div>

  <!-- Main Viewport -->
  <main class="connected-viewport">
    <div class="connected-header">
      <h1 class="connected-title">Stay Connected</h1>
      
      <!-- Subscription Form -->
      <form class="subscribe-form" id="subscribe-form" novalidate>
        <input type="email" class="subscribe-input" placeholder="sup@gmail.com" required />
        <button type="submit" class="subscribe-btn">→</button>
      </form>
      <div class="error-msg-container" id="error-msg">Please enter a valid email address.</div>
    </div>
    
    <canvas id="crowd-canvas"></canvas>
  </main>

  <!-- Crowd Logic Script -->
  <script type="module" src="./topology-background.js"></script>
  <script type="module" src="./mobile-floating-menu.js"></script>
  <script type="module" src="./animated-nav.js"></script>
  <script type="module" src="./stay-connected.js"></script>
  <script src="/register-sw.js"></script>
</body>
</html>
