  <style>
    /* Specific styles for the Team page */
    html, body {
      overflow-x: hidden;
      width: 100%;
      min-height: 100svh;
      min-height: 100dvh;
    }

    .team-viewport {
      position: relative;
      width: 100%;
      max-width: 100vw;
      height: 100svh;
      height: 100dvh;
      min-height: 100svh;
      background-color: transparent;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      box-sizing: border-box;
      padding: 0 12px;
    }
    
    .team-kicker {
      font-size: clamp(0.68rem, 2vw, 0.76rem);
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #8C6D3B;
      margin-bottom: clamp(10px, 1.8vh, 18px);
      user-select: none;
      opacity: 0.92;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      z-index: 20;
    }

    /* Profile row at the top */
    .profile-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      height: 170px;
      width: max-content;
      max-width: 92%;
      z-index: 20;
      padding: 10px;
    }
    
    .profile-img-container {
      position: relative;
      width: 96px;
      height: 96px;
      cursor: pointer;
      transform-origin: center center;
      transform: translate3d(var(--profile-tx, 0px), 0, 0) scale(var(--profile-scale, 1));
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.35s ease,
                  box-shadow 0.35s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      z-index: 25;
      border-radius: 18px;
      border: 2.5px solid rgba(0, 0, 0, 0.06);
      background: #FFF7EB;
      overflow: hidden;
      will-change: transform, opacity;
      -webkit-tap-highlight-color: transparent;
    }
    
    .profile-img-container.active {
      z-index: 30;
      border-color: #6C0D2C;
      box-shadow: 0 12px 30px rgba(108, 13, 44, 0.22);
    }
    
    .profile-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 15px;
      pointer-events: none;
      transition: transform 0.45s ease;
    }

    /* Minimalist Dots Indicator on Mobile */
    .team-dots-indicator {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      z-index: 20;
    }

    .team-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.16);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .team-dot.active {
      width: 22px;
      border-radius: 10px;
      background: #6C0D2C;
      box-shadow: 0 2px 8px rgba(108, 13, 44, 0.3);
    }

    /* Role label below the profiles */
    .role-display {
      font-size: 0.84rem;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.45);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 24px;
      height: 24px;
      line-height: 24px;
      transition: color 0.3s ease, opacity 0.3s ease;
      z-index: 10;
      text-align: center;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .role-display.is-active-member {
      color: #6C0D2C;
      font-weight: 800;
    }
    
    /* Giant text section */
    .giant-text-container {
      position: relative;
      width: 100%;
      max-width: 100vw;
      height: 22vw;
      overflow: hidden;
      margin-top: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .name-wrapper {
      position: absolute;
      width: 100%;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .giant-name {
      font-family: 'Anton', sans-serif;
      font-size: clamp(3.5rem, 28vw, 24rem);
      text-transform: uppercase;
      line-height: 0.8;
      margin: 0;
      padding: 0;
      letter-spacing: -0.02em;
      white-space: nowrap;
      user-select: none;
      display: flex;
      justify-content: center;
    }
    
    /* Text reveal states */
    .giant-name.default {
      color: #000000;
    }
    
    .giant-name.active-member {
      color: #6C0D2C;
    }
    
    .letter {
      display: inline-block;
      transform: translateY(150%);
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .slide-in .letter {
      transform: translateY(0);
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .slide-out .letter {
      transform: translateY(150%) !important;
      transition-duration: 0.28s !important;
      transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    .profile-row-break {
      display: none;
    }

    /* =========================================================
       TEAM RESPONSIVE MEDIA QUERIES (Height & Width Balanced)
       ========================================================= */

    /* Mobile Phones (≤ 768px): 2 Lines (3 on top, 2 below) */
    @media (max-width: 768px) {
      .team-viewport {
        justify-content: center;
        padding-top: max(14px, env(safe-area-inset-top, 14px));
        padding-bottom: max(64px, calc(44px + env(safe-area-inset-bottom, 0px)));
      }
      .team-dots-indicator {
        display: flex;
      }
      .profile-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: clamp(10px, 3.2vw, 16px);
        width: 100%;
        max-width: clamp(320px, 92vw, 400px);
        height: auto;
        margin: 0 auto clamp(8px, 1.5vh, 16px) auto;
        padding: 4px;
      }
      .profile-row-break {
        display: block;
        width: 100%;
        height: 0;
        flex-basis: 100%;
      }
      .profile-img-container {
        width: clamp(88px, 25vw, 108px);
        height: clamp(88px, 25vw, 108px);
        border-radius: clamp(18px, 4.5vw, 22px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        border: 2.5px solid rgba(0, 0, 0, 0.08);
      }
      .profile-img-container.active {
        border-color: #6C0D2C;
        box-shadow: 0 8px 24px rgba(108, 13, 44, 0.22);
        transform: scale(1.04);
      }
      .role-display {
        font-size: clamp(0.78rem, 2.6vw, 0.88rem);
        letter-spacing: 0.14em;
        margin-top: 0;
        margin-bottom: clamp(6px, 1.2vh, 14px);
      }
      .giant-text-container {
        margin-top: 0;
        height: clamp(110px, 20vh, 180px);
        margin-bottom: clamp(4px, 1vh, 12px);
      }
      .giant-name {
        font-size: clamp(3.8rem, 25vw, 6.8rem);
        transform: scaleY(1.26);
        transform-origin: center center;
      }
    }

    /* Narrow Screen Phones (≤ 360px) */
    @media (max-width: 360px) {
      .profile-row {
        gap: 8px;
        margin-bottom: 8px;
      }
      .profile-img-container {
        width: 78px;
        height: 78px;
        border-radius: 16px;
      }
      .role-display {
        font-size: 0.74rem;
        margin-bottom: 6px;
      }
      .giant-text-container {
        height: 95px;
      }
      .giant-name {
        font-size: clamp(3rem, 24vw, 3.8rem);
        transform: scaleY(1.22);
      }
    }

    /* Short Screen Fallback (Height ≤ 600px) */
    @media (max-height: 600px) and (max-width: 768px) {
      .team-viewport {
        justify-content: center;
        padding-top: max(6px, env(safe-area-inset-top, 6px));
        padding-bottom: max(45px, calc(20px + env(safe-area-inset-bottom, 0px)));
      }
      .team-kicker {
        display: none;
      }
      .profile-row {
        height: auto;
        margin-bottom: 4px;
      }
      .profile-img-container {
        width: clamp(52px, 14vw, 64px);
        height: clamp(52px, 14vw, 64px);
        border-radius: 12px;
      }
      .team-dots-indicator {
        margin: 2px 0 4px 0;
      }
      .role-display {
        font-size: 0.72rem;
        margin-top: 0;
        margin-bottom: 4px;
        height: 16px;
      }
      .giant-text-container {
        height: clamp(50px, 12vh, 70px);
        margin-top: 0;
      }
      .giant-name {
        font-size: clamp(2.2rem, 12vh, 3.4rem);
      }
    }

    /* Landscape Mode on Phones (Height ≤ 520px) */
    @media (max-height: 520px) and (orientation: landscape) {
      .team-viewport {
        padding-top: max(6px, env(safe-area-inset-top, 6px));
        padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
        justify-content: center;
      }
      .profile-row {
        gap: 8px;
        height: clamp(50px, 16vh, 65px);
        margin-bottom: 2px;
      }
      .profile-img-container {
        width: clamp(44px, 12vh, 52px);
        height: clamp(44px, 12vh, 52px);
        border-radius: 10px;
      }
      .role-display {
        font-size: 0.68rem;
        margin-top: 4px;
        margin-bottom: 2px;
        height: 16px;
      }
      .giant-text-container {
        margin-top: 0;
        height: clamp(38px, 14vh, 50px);
      }
      .giant-name {
        font-size: clamp(1.8rem, 14vh, 2.8rem);
      }
    }
  </style>

  </nav>

  <script>
    (function() {
      const nav = document.querySelector('.nav-pill');
      const items = nav.querySelectorAll('.nav-item');
      
      // Prefetch page on hover to ensure instant load
      items.forEach(item => {
        item.addEventListener('mouseenter', () => {
          const href = item.getAttribute('href');
          if (href && href !== window.location.pathname) {
            const linkId = `prefetch-${href.replace(/\//g, '')}`;
            if (!document.getElementById(linkId)) {
              const link = document.createElement('link');
              link.id = linkId;
              link.rel = 'prefetch';
              link.href = href;
              document.head.appendChild(link);
            }
          }
        });
      });
    })();
  </script>
