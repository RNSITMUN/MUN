<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUNSoc RNSIT | Home</title>
  <meta name="description" content="An interactive, premium 3D Globe Carousel featuring custom rotation and high-resolution art visuals.">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mun-rnsit.vercel.app/">
  <meta property="og:title" content="MUNSoc RNSIT | Home">
  <meta property="og:description" content="An interactive, premium 3D Globe Carousel featuring custom rotation and high-resolution art visuals.">
  <meta property="og:image" content="https://raw.githubusercontent.com/Karthikprasadm/MUN/main/assets/Logos/MUN_logo.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://mun-rnsit.vercel.app/">
  <meta property="twitter:title" content="MUNSoc RNSIT | Home">
  <meta property="twitter:description" content="An interactive, premium 3D Globe Carousel featuring custom rotation and high-resolution art visuals.">
  <meta property="twitter:image" content="https://raw.githubusercontent.com/Karthikprasadm/MUN/main/assets/Logos/MUN_logo.png">
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" href="./assets/Logos/MUN_logo.png">
  <link rel="apple-touch-icon" href="/assets/Logos/MUN_logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6C0D2C">
  
  <!-- Preload Critical Assets for Instant Rendering -->
  <link rel="preload" as="image" href="./assets/Logos/25_logo.png">
  <link rel="preload" as="image" href="./assets/Logos/MUN_logo.png">
  <link rel="preload" as="image" href="./globe/1.jpeg">
  <link rel="preload" as="image" href="./globe/2.jpeg">
  <link rel="preload" as="image" href="./globe/3.jpeg">
</head>
<body>


  <!-- Preloader Screen -->
  <div id="preloader">
    <p id="preloader-text">Hello</p>
    <svg id="preloader-svg">
      <path id="preloader-path" />
    </svg>
  </div>
  <script>
    // Synchronously hide the preloader if already visited in this session to prevent visual flashes
    if (sessionStorage.getItem("hasVisited") === "true") {
      document.getElementById("preloader").style.display = "none";
    }
  </script>

  <script>
    (function() {
      // If already visited, remove the preloader element immediately on load and return
      if (sessionStorage.getItem("hasVisited") === "true") {
        document.addEventListener("DOMContentLoaded", () => {
          const preloaderEl = document.getElementById("preloader");
          if (preloaderEl) preloaderEl.remove();
        });
        return;
      }

      const words = ["Hello", "bonjour", "Ciao", "Olà", "やあ", "Hallå", "Guten tag", "ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ ਜੀ"];
      let index = 0;
      
      const width = window.innerWidth;
      const height = window.innerHeight;
      
      const initialPath = `M0 0 L${width} 0 L${width} ${height} Q${width/2} ${height + 300} 0 ${height} L0 0`;
      const targetPath = `M0 0 L${width} 0 L${width} ${height} Q${width/2} ${height} 0 ${height} L0 0`;
      
      document.addEventListener("DOMContentLoaded", () => {
        const pathEl = document.getElementById("preloader-path");
        const textEl = document.getElementById("preloader-text");
        const preloaderEl = document.getElementById("preloader");
        
        if (pathEl) pathEl.setAttribute("d", initialPath);
        
        const cycleWords = () => {
          if (index < words.length - 1) {
            const timeout = index === 0 ? 1000 : 150;
            setTimeout(() => {
              index++;
              if (textEl) textEl.textContent = words[index];
              cycleWords();
            }, timeout);
          } else {
            setTimeout(() => {
              if (preloaderEl) preloaderEl.classList.add("exit");
              
              // Set the session flag when preloader begins exiting
              sessionStorage.setItem("hasVisited", "true");
              
              setTimeout(() => {
                if (preloaderEl) preloaderEl.remove();
              }, 850); // Matches the 0.8s CSS fade transition
            }, 100);
          }
        };
        
        cycleWords();
      });
    })();
  </script>

  <!-- Navigation Pill -->
  <nav class="nav-pill">
    <a href="/" class="nav-item active" id="nav-gallery">Home</a>
    <a href="/past-events" class="nav-item" id="nav-past">Past Events</a>
    <a href="/registration" class="nav-item" id="nav-registration">Registration</a>
    <a href="/stay-connected" class="nav-item" id="nav-connected">Stay Connected</a>
    <a href="/team" class="nav-item" id="nav-team">Team</a>
  </nav>

  <script>
    (function() {
      const nav = document.querySelector('.nav-pill');
      const items = nav.querySelectorAll('.nav-item');
      
      // Prefetch page on hover to ensure instant load
      items.forEach(item => {
        item.addEventListener('mouseenter', () => {
          const href = item.getAttribute('href');
          if (href && href !== window.location.pathname) {
            const linkId = `prefetch-${href.replace(/\//g, '')}`;
            if (!document.getElementById(linkId)) {
              const link = document.createElement('link');
              link.id = linkId;
              link.rel = 'prefetch';
              link.href = href;
              document.head.appendChild(link);
            }
          }
        });
      });
    })();
  </script>

  <!-- Top Left Logo -->
  <div class="top-left-logo-container">
    <img src="./assets/Logos/25_logo.png" alt="25 Logo" class="top-left-logo">
  </div>

  <!-- Top Right Logo -->
  <div class="top-right-logo-container">
    <img src="./assets/Logos/MUN_logo.png" alt="MUN Logo" class="top-right-logo">
  </div>

  <!-- Main Globe Container -->
  <main class="globe-viewport">
    <div id="carousel-root" class="carousel-container"></div>
  </main>

  <script type="module" src="./app.js"></script>
  <script src="/register-sw.js"></script>
</body>
</html>
