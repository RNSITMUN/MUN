<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | MUNSoc RNSIT</title>
  <meta name="description" content="Adjourned in error. The session you are looking for does not exist.">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mun-rnsit.vercel.app/404">
  <meta property="og:title" content="404 | MUNSoc RNSIT">
  <meta property="og:description" content="Adjourned in error. The session you are looking for does not exist.">
  <meta property="og:image" content="https://raw.githubusercontent.com/Karthikprasadm/MUN/main/assets/Logos/MUN_logo.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://mun-rnsit.vercel.app/404">
  <meta property="twitter:title" content="404 | MUNSoc RNSIT">
  <meta property="twitter:description" content="Adjourned in error. The session you are looking for does not exist.">
  <meta property="twitter:image" content="https://raw.githubusercontent.com/Karthikprasadm/MUN/main/assets/Logos/MUN_logo.png">
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&family=Anton&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" href="./assets/Logos/MUN_logo.png">
  <link rel="apple-touch-icon" href="/assets/Logos/MUN_logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6C0D2C">
  <style>
    .error-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      background-color: #000000; /* Dark canvas for background video fallback */
      position: relative;
      overflow: hidden;
    }

    /* Fullscreen Background Video */
    .video-bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }
    
    .bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-shade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25); /* Slightly darker shade to support high-contrast white text overlays */
      z-index: 2;
      pointer-events: none;
    }
    
    /* Transparent parallax container card */
    .error-container {
      z-index: 3;
      width: 100%;
      max-width: 580px;
      background: transparent; /* Removed card background completely */
      border: none; /* Removed card border */
      box-shadow: none; /* Removed card shadow */
      padding: 0;
      box-sizing: border-box;
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.3, 1);
    }
    
    .error-code-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      user-select: none;
    }
    
    .error-digit {
      font-family: 'Anton', sans-serif;
      font-size: 6.5rem;
      line-height: 1;
      color: #ffffff; /* Clean white for dark video backdrop */
      display: inline-block;
      text-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); /* Drop-shadow for legibility */
    }
    
    .error-title {
      font-family: var(--font-sans);
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      color: #ffffff;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    
    .error-description {
      font-family: var(--font-sans);
      font-size: 1.1rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.85); /* Slightly muted white for visual hierarchy */
      line-height: 1.6;
      margin-bottom: 28px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action-button {
      font-family: var(--font-sans);
      font-size: 0.92rem;
      font-weight: 600;
      color: #000000;
      background: #ffffff; /* Solid white background for contrast */
      border: none;
      border-radius: 9999px;
      padding: 12px 28px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.3, 1),
                  background-color 0.3s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .action-button:hover {
      background-color: rgba(255, 255, 255, 0.85);
      transform: translateY(-2px);
    }

    .sound-toggle-btn {
      font-family: var(--font-sans);
      font-size: 0.92rem;
      font-weight: 600;
      color: #ffffff;
      background: transparent;
      border: 2px solid #ffffff; /* White border outline */
      border-radius: 9999px;
      padding: 10px 24px;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .sound-toggle-btn:hover {
      background-color: #ffffff;
      color: #000000;
      transform: translateY(-2px);
    }
    
    /* Navigation Link Colors overlayed on video */
    .nav-item {
      color: rgba(255, 255, 255, 0.7);
    }
    .nav-item:hover, .nav-item.active {
      color: #ffffff;
    }
    
    /* Top Logos and Nav z-index adjustments so they display over fullscreen video */
    .nav-pill, .top-left-logo-container, .top-right-logo-container {
      z-index: 10;
    }
    
    @media (max-width: 768px) {
      .error-container {
        padding: 0 16px;
        max-width: 90%;
      }
      .error-digit {
        font-size: 5rem;
      }
      .error-title {
        font-size: 1.8rem;
      }
      .error-description {
        font-size: 0.98rem;
      }
      .btn-group {
        flex-direction: column;
      }
      .action-button, .sound-toggle-btn {
        width: 100%;
        box-sizing: border-box;
      }
    }
  </style>
</head>
<body>


  <!-- Fullscreen Background Video -->
  <div class="video-bg-container">
    <video autoplay loop muted playsinline class="bg-video" id="rick-video">
      <source src="/Rick_Roll.mp4" type="video/mp4">
      <source src="/404-video.mp4" type="video/mp4">
      <source src="https://assets.mixkit.co/videos/preview/mixkit-spinning-photo-of-a-globe-loop-42861-large.mp4" type="video/mp4">
    </video>
    <div class="video-shade-overlay"></div>
  </div>



  <!-- Main Content -->
  <main class="error-viewport">
    <!-- Parallax floating container card -->
    <div class="error-container" id="parallax-card">
      <!-- 404 Heading -->
      <div class="error-code-container">
        <span class="error-digit">4</span>
        <span class="error-digit">0</span>
        <span class="error-digit">4</span>
      </div>

      <h1 class="error-title">Adjourned In Error</h1>
      <p class="error-description">
        The session you are looking for does not exist or has been moved to a different assembly.
      </p>
      
      <div class="btn-group">
        <button class="sound-toggle-btn" id="sound-btn">🔊 Enable Audio</button>
        <a href="/" class="action-button">Return to Assembly</a>
      </div>
    </div>
  </main>

  <script>
    // Magnetic interactive parallax floating effect for the main container card
    const card = document.getElementById('parallax-card');
    
    document.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX;
      const mouseY = e.clientY;
      
      const rect = card.getBoundingClientRect();
      const cardX = rect.left + rect.width / 2;
      const cardY = rect.top + rect.height / 2;
      
      const deltaX = mouseX - cardX;
      const deltaY = mouseY - cardY;
      const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      
      const maxDistance = 350; // Distance inside which the card drifts
      
      if (distance < maxDistance) {
        const force = (maxDistance - distance) / maxDistance; // 0 to 1
        const repelDistance = 25; // Drift range in pixels
        const translateX = -(deltaX / distance) * force * repelDistance;
        const translateY = -(deltaY / distance) * force * repelDistance;
        
        // Card drifts slightly and tilts toward/away from the cursor
        card.style.transform = `translate(${translateX}px, ${translateY}px) rotateX(${-translateY * 0.1}deg) rotateY(${translateX * 0.1}deg)`;
      } else {
        card.style.transform = 'translate(0, 0) rotate(0deg)';
      }
    });
    
    document.addEventListener('mouseleave', () => {
      card.style.transform = 'translate(0, 0) rotate(0deg)';
    });

    // Toggle mute state and change button text
    const soundBtn = document.getElementById('sound-btn');
    const video = document.getElementById('rick-video');
    
    soundBtn.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
        soundBtn.textContent = '🔇 Mute Audio';
      } else {
        video.muted = true;
        soundBtn.textContent = '🔊 Enable Audio';
      }
    });
  </script>
  <script src="/register-sw.js"></script>
</body>
</html>
